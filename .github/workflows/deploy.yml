name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: thisismoneyv2-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure deployment key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/timv2_deploy
          chmod 600 ~/.ssh/timv2_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Synchronize application
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          rsync -az --delete --delay-updates \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='.claude-flow' \
            -e "ssh -i ~/.ssh/timv2_deploy" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:/home/dev/apps/thisismoneyv2/"

      - name: Verify public application
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 5 https://timv2.rlz.cl/ | grep -q '<div id="root"'
